# Runs in GitHub's cloud every 20 minutes (GitHub often delays/skips scheduled runs, so we ask often).
# A cheap first step checks the daily cap / spacing; the heavy work only runs when a Short is due.
# Finds the most-viewed GTA 6 Twitch clips, Haiku judges them, the best is published as a Release
# (tag gta6-NNNN) for John's Grok to post.
name: GTA6 Shorts

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}   # "Run workflow" button for manual tests

permissions:
  contents: write         # create releases (history is read back from them; no commits)

concurrency:
  group: gta6-shorts
  cancel-in-progress: false

jobs:
  make-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Is a Short due?
        id: quota
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python GTA6/gta6_clipper.py --check-quota

      - uses: actions/setup-python@v5
        if: steps.quota.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: GTA6/requirements.txt

      - name: Install ffmpeg + Impact font
        if: steps.quota.outputs.go == 'true'
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg ttf-mscorefonts-installer > /dev/null

      - name: Install Python packages
        if: steps.quota.outputs.go == 'true'
        run: pip install -q -r GTA6/requirements.txt

      - name: Cache Whisper model
        if: steps.quota.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-en

      - name: Restore judged-clips memory
        if: steps.quota.outputs.go == 'true'
        uses: actions/cache/restore@v4
        with:
          path: GTA6/state/judged.json
          key: judged-${{ github.run_id }}
          restore-keys: judged-

      - name: Find, judge, make, publish
        if: steps.quota.outputs.go == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAPTION_FONT_FILE: /usr/share/fonts/truetype/msttcorefonts/Impact.ttf
          CAPTION_FONT_NAME: Impact
        run: python GTA6/gta6_clipper.py --publish --out /tmp/gta6_out

      - name: Save judged-clips memory
        if: always() && steps.quota.outputs.go == 'true'
        uses: actions/cache/save@v4
        with:
          path: GTA6/state/judged.json
          key: judged-${{ github.run_id }}
